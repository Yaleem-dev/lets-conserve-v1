<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F6B4F'/%3E%3Cpath d='M16 24c0-6 4-10 9-11-1 6-4 10-9 11z' fill='none' stroke='%23FBFAF6' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M16 24c0-4-3-7-7-8' fill='none' stroke='%23FBFAF6' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e3f1bd" />

    <title>Let's Conserve | Your personal guide for eco-action</title>
    <meta
      name="description"
      content="Learn something, discover something, do something. Bite-sized climate explainers, practical action guides, a directory of environmental organizations, and weekly eco-quests."
    />
    <link rel="canonical" href="https://lets-conserve.vercel.app/" />

    <!-- Open Graph: absolute URLs only, otherwise WhatsApp, iMessage,
         Slack and X will show a bare link with no picture. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Let's Conserve" />
    <meta property="og:url" content="https://lets-conserve.vercel.app/" />
    <meta property="og:title" content="Let's Conserve | Your personal guide for eco-action" />
    <meta
      property="og:description"
      content="Learn something, discover something, do something. Short explainers, real places, and small steps you can finish this week."
    />
    <meta property="og:image" content="https://lets-conserve.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://lets-conserve.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Let's Conserve, a personal guide for eco-action, with the Learn, Discover, Do line and an anime park illustration." />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X falls back to these when og tags are absent -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Let's Conserve | Your personal guide for eco-action" />
    <meta
      name="twitter:description"
      content="Learn something, discover something, do something. Short explainers, real places, and small steps you can finish this week."
    />
    <meta name="twitter:image" content="https://lets-conserve.vercel.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="Let's Conserve link card with an anime park illustration." />

    <!-- iOS home screen + Android mask -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Let's Conserve" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
